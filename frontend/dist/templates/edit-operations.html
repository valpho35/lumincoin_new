<div class="content">
    <div class="edit-operations">
        <div class="income-title" id="operation-title">Редактирование дохода/расхода</div>

        <form id="operation-form" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="type" class="form-label">Тип операции *</label>
                <select class="form-select" id="type" name="type" required>
                    <option value="income">Доход</option>
                    <option value="expense">Расход</option>
                </select>
                <!-- <div class="invalid-feedback">
                    Пожалуйста, выберите тип операции
                </div> -->
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Категория *</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="">Выберите категорию</option>
                </select>
                <div class="invalid-feedback">
                    Пожалуйста, выберите категорию
                </div>
            </div>

            <div class="mb-3">
                <label for="amount" class="form-label">Сумма ($) *</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="amount" name="amount" placeholder="0.00" step="0.01"
                        min="0.01" required>
                </div>
                <div class="invalid-feedback">
                    Сумма должна быть больше 0
                </div>
            </div>

            <div class="mb-3">
                <label for="date" class="form-label">Дата *</label>
                <input type="date" class="form-control" id="date" name="date" required>
                <div class="invalid-feedback">
                    Пожалуйста, выберите дату
                </div>
            </div>

            <div class="mb-3">
                <label for="comment" class="form-label">Комментарий</label>
                <textarea class="form-control" id="comment" name="comment" rows="3"
                    placeholder="Введите комментарий" required></textarea>
                <div class="invalid-feedback">
                    Необходимо написать комментарий
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-success">Сохранить</button>
                <button type="button" class="btn btn-danger" id="cancel-btn">Отмена</button>
            </div>
        </form>
    </div>
</div>
